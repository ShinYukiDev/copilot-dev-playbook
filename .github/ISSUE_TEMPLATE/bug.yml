name: "Bug"
description: "不具合の報告から原因調査、対応内容まで記録する"
title: "[Bug] "
body:
  - type: "textarea"
    id: "bug-probe-id"
    attributes:
      label: "事象"
      description: "発生している問題を簡潔に記載してください。"
      placeholder: "例: 保存ボタンを押しても変更内容が反映されない"
    validations:
      required: true

  - type: "dropdown"
    id: "priority"
    attributes:
      label: "優先度"
      description: "業務影響に応じて選択してください。"
      options:
        - "Critical"
        - "High"
        - "Medium"
        - "Low"
    validations:
      required: true

  - type: "textarea"
    id: "impact-scope"
    attributes:
      label: "影響範囲"
      description: "どのユーザー、機能、画面、運用に影響するかを記載してください。"
      placeholder: "例: 管理者ユーザーのみ影響"
    validations:
      required: true

  - type: "textarea"
    id: "steps-to-reproduce"
    attributes:
      label: "再現手順"
      description: "第三者が同じ条件で再現できるように記載してください。"
      placeholder: "1. 設定画面を開く\n2. 入力する\n3. 保存する"
    validations:
      required: true

  - type: "textarea"
    id: "occurrence-conditions"
    attributes:
      label: "発生条件"
      description: "発生する条件、対象ユーザー、入力値、事前状態、発生頻度を記載してください。"
      placeholder: "例: ログイン済みユーザーで毎回発生"
    validations:
      required: true

  - type: "textarea"
    id: "expected-behavior"
    attributes:
      label: "期待される動作"
      description: "本来どう動くべきかを記載してください。"
      placeholder: "例: 保存完了メッセージが表示される"
    validations:
      required: true

  - type: "textarea"
    id: "actual-behavior"
    attributes:
      label: "実際の動作"
      description: "実際に発生した結果を記載してください。"
      placeholder: "例: 保存完了メッセージは表示されるが更新されない"
    validations:
      required: true
