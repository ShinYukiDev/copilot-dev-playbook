name: Bug
description: 不具合の報告から原因調査、対応内容まで記録する
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        不具合の内容を記載してください。原因調査や対応方針が判明している場合はあわせて記載してください。

  - type: textarea
    id: issue-summary
    attributes:
      label: 事象
      description: 発生している問題を簡潔に記載してください。
      placeholder: 例: 保存ボタンを押しても変更内容が反映されない
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      description: 業務影響に応じて選択してください。Critical は業務停止または全ユーザー影響、High は主要機能停止または 50%以上のユーザー影響、Medium は回避策ありの一部機能影響、Low は限定的な影響です。
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: textarea
    id: impact-scope
    attributes:
      label: 影響範囲
      description: どのユーザー、機能、画面、運用に影響するかを記載してください。
      placeholder: |
        例:
        - 管理者ユーザーのみ影響
        - CSV 取込機能全体に影響
        - 月次運用作業が継続できない
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: 再現手順
      description: 対象画面、入力値、操作順、実行回数を含めて、第三者が同じ条件で再現できるように記載してください。
      placeholder: |
        1. 設定画面を開く
        2. 表示名に「テスト太郎」を入力する
        3. 保存ボタンを1回押す
        4. 一覧画面へ戻る
        5. 表示名が更新されていないことを確認する
    validations:
      required: true

  - type: textarea
    id: occurrence-conditions
    attributes:
      label: 発生条件
      description: 発生する条件、対象ユーザー、入力値、事前状態、発生頻度を記載してください。
      placeholder: |
        例:
        - ログイン済みユーザーで発生
        - 特定のCSVファイルをアップロードした場合に発生
        - 毎回発生 / ときどき発生
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 期待される動作
      description: 本来どう動くべきかを、画面表示、メッセージ、データ更新結果を含めて記載してください。
      placeholder: 例: 保存完了メッセージが表示され、一覧画面に変更内容が反映される
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: 実際の動作
      description: 実際に発生した結果を、表示メッセージ、挙動、データ状態を含めて記載してください。
      placeholder: 例: 保存完了メッセージは表示されるが、一覧画面に変更内容が反映されない
    validations:
      required: true
