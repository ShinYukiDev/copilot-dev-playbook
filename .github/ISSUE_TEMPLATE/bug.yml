name: "Bug"
description: "不具合の報告から原因調査、対応内容まで記録する"
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        不具合の内容を記載してください。原因調査や対応方針が判明している場合はあわせて記載してください。

  - type: "textarea"
    id: "bug-probe-id"
    attributes:
      label: "事象"
      description: "発生している問題を簡潔に記載してください。"
      placeholder: "例: 保存ボタンを押しても変更内容が反映されない"
    validations:
      required: true

  - type: "dropdown"
    id: "priority"
    attributes:
      label: "優先度"
      description: "業務影響に応じて選択してください。"
      options:
        - "Critical"
        - "High"
        - "Medium"
        - "Low"
    validations:
      required: true

  - type: "textarea"
    id: "impact-scope"
    attributes:
      label: "影響範囲"
      description: "どのユーザー、機能、画面、運用に影響するかを記載してください。"
      placeholder: |
        例:
        - 管理者ユーザーのみ影響
        - CSV 取込機能全体に影響
        - 月次運用作業が継続できない
    validations:
      required: true

  - type: "textarea"
    id: "steps-to-reproduce"
    attributes:
      label: "再現手順"
      description: "対象画面、入力値、操作順、実行回数を含めて、第三者が同じ条件で再現できるように記載してください。"
      placeholder: |
        1. 設定画面を開く
        2. 表示名に「テスト太郎」を入力する
        3. 保存ボタンを1回押す
        4. 一覧画面へ戻る
        5. 表示名が更新されていないことを確認する
    validations:
      required: true

  - type: "textarea"
    id: "occurrence-conditions"
    attributes:
      label: "発生条件"
      description: "発生する条件、対象ユーザー、入力値、事前状態、発生頻度を記載してください。"
      placeholder: "例: ログイン済みユーザーで毎回発生"
    validations:
      required: true

  - type: "textarea"
    id: "expected-behavior"
    attributes:
      label: "期待される動作"
      description: "本来どう動くべきかを記載してください。"
      placeholder: "例: 保存完了メッセージが表示される"
    validations:
      required: true

  - type: "textarea"
    id: "actual-behavior"
    attributes:
      label: "実際の動作"
      description: "実際に発生した結果を記載してください。"
      placeholder: "例: 保存完了メッセージは表示されるが更新されない"
    validations:
      required: true

  - type: "textarea"
    id: "investigation"
    attributes:
      label: "原因調査"
      description: "調査して分かったこと、確認した範囲、原因候補があれば記載してください。"
      placeholder: "例: ログ確認の結果、入力値のバリデーション分岐で不整合"

  - type: "textarea"
    id: "resolution"
    attributes:
      label: "対応内容"
      description: "修正方針、回避策、恒久対応案が決まっていれば記載してください。"
      placeholder: "例: 条件分岐を修正し、入力値の正規化を追加"

  - type: "textarea"
    id: "workaround"
    attributes:
      label: "暫定回避策"
      description: "利用者向けの暫定回避策があれば記載してください。"
      placeholder: "例: 再読み込み後に再実行すると成功する"

  - type: "textarea"
    id: "verification"
    attributes:
      label: "確認内容・未確認事項"
      description: "修正後に確認した観点、確認結果、未確認事項を記載してください。"
      placeholder: "例: 再現手順で再発しないことを確認。関連機能の確認は未実施。"

  - type: "textarea"
    id: "environment"
    attributes:
      label: "環境情報"
      description: "OS、ブラウザ、アプリ版、対象ブランチ、発生環境を記載してください。"
      placeholder: "例: Windows 11 / Chrome 134 / main / 開発環境"
    validations:
      required: true

  - type: "textarea"
    id: "evidence"
    attributes:
      label: "証跡"
      description: "ログ、スクリーンショット、エラーメッセージ、関連URLがあれば記載してください。"
      placeholder: "例: 500 Internal Server Error, /settings/profile"
