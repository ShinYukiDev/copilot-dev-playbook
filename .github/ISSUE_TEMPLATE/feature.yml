name: "Feature"
description: "新機能追加や利用者価値を高める機能改善を提案する"
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        実現したい機能や改善内容を整理して記載してください。

  - type: textarea
    id: overview
    attributes:
      label: 概要
      description: 何を実現したいかを簡潔に記載してください。
      placeholder: "例: Issue テンプレートを導入し、記載内容を標準化する"
    validations:
      required: true
